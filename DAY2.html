<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href=".style.css">
     <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.12.4/babel.js"></script>
</head>
<body>
    <div id="root">

    </div>
    <script type="text/babel">
        const Welcome = (props) => <h1 className="greeting"> {props.greeting} {props.name}</h1> // Component is used and return JSX Element must and should.
        const Greeting = () => <div>
            <Welcome name ="Vilas" greeting="Hey"/>
            <Welcome name="Vishali" greeting="Good Morning"/> </div>
        ReactDOM.render(<Greeting />, document.getElementById("root"));
    </script>
</body>
</html>
